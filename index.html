<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mathgic AI: Your Grade 7 Math Tutor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<style>
:root{
  --bg:#f5f7ff; --surface:#ffffff; --text:#1d2340; --muted:#5d6488;
  --brand:#5b4bff; --brand-text:#ffffff; --tutor-bg:#ffffff; --tutor-border:#dfe3fb;
  --me-bg:#5b4bff; --me-text:#ffffff; --err:#c62828; color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12142a; --surface:#1b1e3a; --text:#eceeff; --muted:#a3a9d6;
    --brand:#8a7dff; --brand-text:#12142a; --tutor-bg:#1b1e3a; --tutor-border:#2e3263;
    --me-bg:#8a7dff; --me-text:#12142a; --err:#ff8a80; color-scheme:dark;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
.app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto}
header{padding:14px 16px 10px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--brand);color:var(--brand-text);display:grid;place-items:center;font-size:24px;font-weight:800}
h1{margin:0;font-size:1.25rem;line-height:1.1}
.tag{margin:2px 0 0;color:var(--muted);font-size:.85rem}
#chat{flex:1;overflow-y:auto;padding:8px 16px 12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.tutor{align-self:flex-start;background:var(--tutor-bg);border:1px solid var(--tutor-border);border-bottom-left-radius:6px}
.me{align-self:flex-end;background:var(--me-bg);color:var(--me-text);border-bottom-right-radius:6px}
.err{align-self:center;color:var(--err);font-size:.9rem;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 8px}
.chip{border:1.5px solid var(--brand);background:transparent;color:var(--text);border-radius:999px;padding:7px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.chip:hover{background:var(--brand);color:var(--brand-text)}
.composer{display:flex;gap:8px;padding:10px 16px 14px;background:var(--bg)}
textarea{flex:1;resize:none;border:1.5px solid var(--tutor-border);background:var(--surface);color:var(--text);border-radius:16px;padding:10px 14px;font:inherit;max-height:140px;min-height:44px}
textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
#send{border:0;background:var(--brand);color:var(--brand-text);border-radius:16px;padding:0 20px;font:inherit;font-weight:800;cursor:pointer}
#send:disabled{opacity:.5;cursor:default}
.note{text-align:center;color:var(--muted);font-size:.75rem;padding:0 16px 8px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">M</div>
    <div>
      <h1>Mathgic AI</h1>
      <p class="tag">Your 7th-grade math tutor · Matematika / Математика</p>
    </div>
  </header>
  <div id="chat" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form class="composer" id="form" onsubmit="return false">
    <textarea id="input" rows="1" placeholder="Type your math problem or question…" aria-label="Message Mathgic AI" maxlength="1200"></textarea>
    <button id="send" type="button">Send</button>
  </form>
  <div class="note">Mathgic AI guides you step by step. It never gives the final answer. Please don’t share personal details.</div>
</div>
<script>
const GREETING = "Hi, I’m Mathgic AI! 🎯 I love helping with 7th-grade math. Tell me a problem you’re working on, or pick a topic below, and we’ll figure it out together, one step at a time. What are we tackling today?";
const STARTERS = [
  ["Percents 💯", "I need help with a percent problem."],
  ["Ratios", "I need help with ratios and proportions."],
  ["Equations", "I need help solving an equation."],
  ["Proporsiya (UZ)", "Menga proporsiya masalasida yordam kerak."],
  ["Проценты (RU)", "Мне нужна помощь с задачей на проценты."]
];
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const chips = document.getElementById("chips");
const history = [];
let busy = false, started = false;

function addEl(cls, text){
  const d = document.createElement("div");
  d.className = cls; d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}

async function send(text){
  text = (text || "").trim();
  if (!text || busy) return;
  if (!started){ started = true; chips.style.display = "none"; }
  busy = true; sendBtn.disabled = true;
  input.value = ""; input.style.height = "auto";
  addEl("msg me", text);
  history.push({role:"user", content:text});
  const bubble = addEl("msg tutor", "Thinking…");
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 50000);
    let r;
    try {
      r = await fetch("/api/chat", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({messages: history}),
        signal: ctl.signal
      });
    } finally { clearTimeout(timer); }
    if (r.status === 429) throw "slow";
    if (!r.ok) throw "fail";
    const data = await r.json();
    if (!data.reply) throw "fail";
    bubble.textContent = data.reply;
    history.push({role:"assistant", content:data.reply});
  } catch(e){
    bubble.remove(); history.pop();
    addEl("err", e === "slow" ? "Mathgic AI needs a short break. Try again in a minute." : "Something went wrong. Please try again.");
  } finally {
    busy = false; sendBtn.disabled = false; input.focus();
  }
}

addEl("msg tutor", GREETING);
STARTERS.forEach(([label, msg]) => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = label;
  b.addEventListener("click", () => send(msg));
  chips.appendChild(b);
});
sendBtn.addEventListener("click", () => send(input.value));
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(input.value); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});
</script>
</body>
</html>
